<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Option Hub by Mr. Chartist</title>
    <meta name="description" content="Option Hub by Mr. Chartist: free NSE options analytics with option chain, open interest, Greeks, IV and strategy payoffs. Data for education and research. Not investment advice." />
    <meta name="author" content="Mr. Chartist" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F1EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D0E" />

    <!-- canonical, og:url, og:image and the SoftwareApplication JSON-LD are filled in at build time
         by the site-meta plugin in vite.config.ts: from VITE_SITE_URL when it is set, otherwise
         canonical points at https://mrchartist.com/open-source/india-s-best-option-hub. -->
    <!-- Official Mr. Chartist mark. The SVG switches black/white with the OS scheme; the .ico is
         a neutral grey that reads on light and dark tab bars. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Option Hub" />
    <meta name="application-name" content="Option Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Apply the saved scheme before first paint. "system" (default) follows the OS.
      (function () {
        var root = document.documentElement;
        var mode = "system";
        try {
          var saved = window.localStorage.getItem("theme");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {
          /* storage blocked: follow the system */
        }
        var dark = false;
        try {
          dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          dark = mode === "dark";
        }
        root.classList.toggle("dark", dark);
        try {
          if (window.localStorage.getItem("palette") === "cvd") root.setAttribute("data-palette", "cvd");
        } catch (e) {
          /* storage blocked: default palette */
        }
        root.style.colorScheme = dark ? "dark" : "light";
        if (mode !== "system") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#0D0D0E" : "#F4F1EA");
        }
      })();
    </script>

    <meta property="og:title" content="Option Hub by Mr. Chartist" />
    <meta property="og:description" content="Free NSE options analytics: option chain, open interest, Greeks, IV and strategy payoffs. Data for education and research." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Option Hub by Mr. Chartist" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Mr. Chartist mark: four white swoosh stripes on black" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Mr_Chartist" />
    <meta name="twitter:creator" content="@Mr_Chartist" />
    <meta name="twitter:title" content="Option Hub by Mr. Chartist" />
    <meta name="twitter:description" content="Free NSE options analytics: option chain, open interest, Greeks, IV and strategy payoffs." />
    <meta name="twitter:image" content="__OG_IMAGE__" />
    <meta name="twitter:image:alt" content="The Mr. Chartist mark: four white swoosh stripes on black" />
  </head>

  <body>
    <noscript>Option Hub by Mr. Chartist needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
