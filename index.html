<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mr. Chartist Options Terminal</title>
    <meta name="description" content="Open-source NSE options analytics: option chain, open interest, Greeks, IV and strategy payoffs. Data for education and research. Not investment advice." />
    <meta name="author" content="Mr. Chartist" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060809" />

    <!-- canonical, og:url and the SoftwareApplication JSON-LD are injected at build time from
         VITE_SITE_URL by the site-meta plugin in vite.config.ts (omitted when it is not set). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mr. Chartist" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Plus+Jakarta+Sans:ital,wght@0,500..800;1,500..800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Apply the saved scheme before first paint. "system" (default) follows the OS.
      (function () {
        var root = document.documentElement;
        var mode = "system";
        try {
          var saved = window.localStorage.getItem("theme");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {
          /* storage blocked: follow the system */
        }
        var dark = false;
        try {
          dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          dark = mode === "dark";
        }
        root.classList.toggle("dark", dark);
        try {
          if (window.localStorage.getItem("palette") === "cvd") root.setAttribute("data-palette", "cvd");
        } catch (e) {
          /* storage blocked: default palette */
        }
        root.style.colorScheme = dark ? "dark" : "light";
        if (mode !== "system") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#060809" : "#F3F4EE");
        }
      })();
    </script>

    <meta property="og:title" content="Mr. Chartist Options Terminal" />
    <meta property="og:description" content="Open-source NSE options analytics: option chain, open interest, Greeks, IV and strategy payoffs. Data for education and research." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mr. Chartist Options Terminal" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://raw.githubusercontent.com/MrChartist/india-s-best-option-hub/master/docs/screenshots/dashboard-dark.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mr. Chartist Options Terminal" />
    <meta name="twitter:description" content="Open-source NSE options analytics: option chain, open interest, Greeks, IV and strategy payoffs." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/MrChartist/india-s-best-option-hub/master/docs/screenshots/dashboard-dark.png" />
  </head>

  <body>
    <noscript>Mr. Chartist Options Terminal needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
